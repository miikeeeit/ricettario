<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Ricettario di Mike</title>
<meta name="description" content="Il piano alimentare del trainer: ricette del giorno, spesa, cotto e crudo, progressi.">
<meta name="theme-color" content="#111214">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="store.js"></script>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: scheda da palestra al buio — barra giorni fissa, "la giornata in un colpo d'occhio" in alto,
   poi una card per pasto con i grammi in grande. Un colore per pasto, lime solo per l'allenamento. */
:root{
  /* Mazzo di card: grigio chiaro, titoli neri enormi e stretti, card piene lime, ciano, rosa e sabbia (dal video di riferimento) */
  --bg:#ececea; --s1:#ffffff; --s2:#f3f3f0; --s3:#d6d6d1; --line:#e2e2de;
  --ink:#111111; --muted:#5c5c58; --dim:#9a9a94;
  --lime:#111111; --lime-ink:#ffffff; --lime-soft:#e7fbbd;
  --acc:#b6f23a; --sand:#e6dfcc; --cyan:#41d6d5; --pink:#f3a1a9;
  --amber:#f2a516; --teal:#41d6d5; --violet:#b6f23a; --coral:#ff5a36;
  --m:var(--muted);
  --f-display:"Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --on:#111111; --barbg:#111111; --sh1:rgba(0,0,0,.04); --sh2:rgba(0,0,0,.12); --shg:rgba(0,0,0,.25);
  --warnbg:#fff1d2; --warnink:#5a3b00; --quickb:transparent;
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1100px;margin:0 auto}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}

header.top{padding-block:22px 6px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,6vw,40px);line-height:1;margin:0;text-transform:uppercase;letter-spacing:.01em}
h1 span{color:var(--lime)}
.kcal{font:700 13px var(--f-body);letter-spacing:.04em;color:var(--muted);border:1px solid var(--line);padding:6px 10px;border-radius:999px;white-space:nowrap}
.kcal b{color:var(--ink);font-family:var(--f-display);font-size:15px}

nav.days{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line);
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav.days::-webkit-scrollbar{display:none}
nav.days button{font:700 15px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--s1);border:1px solid transparent;border-radius:10px;
  padding:8px 13px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;position:relative}
nav.days button:hover{color:var(--ink)}
nav.days button.today::after{content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ink)}
nav.days button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
nav.days button[aria-selected="true"].today::after{background:var(--bg)}
nav.days .sep{width:1px;background:var(--line);flex:none;margin:4px 2px}
button:focus-visible,summary:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--lime);flex:none}

section.view{padding-top:20px}

/* ---- giornata ---- */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:14px}
.eyebrow{font:700 12px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center}
.hero h2{font:800 clamp(44px,11vw,72px)/.9 var(--f-display);text-transform:uppercase;margin:4px 0 0;letter-spacing:-.005em}
.badge{display:inline-flex;align-items:center;gap:6px;font:700 12px var(--f-body);letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:999px}
.badge.train{background:var(--lime);color:var(--lime-ink)}
.badge.rest{background:var(--s2);color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:18px}
@media (max-width:640px){.strip{grid-template-columns:1fr 1fr}}
.strip a{display:grid;gap:3px;text-decoration:none;color:var(--ink);background:var(--s1);border-radius:12px;padding:10px 12px 12px;border-top:3px solid var(--m);min-width:0}
.strip a:hover{background:var(--s2)}
.strip .k{font:700 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--m)}
.strip .n{font:700 17px/1.15 var(--f-display);text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere}
.strip .t{font-size:13px;color:var(--muted)}
.m-colazione{--m:var(--amber)} .m-pranzo{--m:var(--teal)} .m-spuntino{--m:var(--violet)} .m-cena{--m:var(--coral)} .m-pre{--m:var(--lime)}
.leadline{color:var(--muted);margin:-6px 0 16px;font-size:15px;max-width:65ch}

.meals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:820px){.meals{grid-template-columns:1fr}}
.meal{background:var(--s1);border-radius:16px;padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px;scroll-margin-top:84px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mtag{display:inline-flex;align-items:center;gap:7px;font:700 12px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--m)}
.mtag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--m)}
.mtime{font:700 14px var(--f-display);letter-spacing:.04em;color:var(--muted);background:var(--s2);padding:3px 9px;border-radius:999px;text-transform:uppercase}
.meal h3{font:800 28px/1 var(--f-display);text-transform:uppercase;margin:0;text-wrap:balance;letter-spacing:.005em}
.tiles-i{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.it{background:var(--s2);border-radius:12px;padding:9px 10px 10px;display:grid;gap:2px;min-width:0}
.it b{font:700 26px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
.it b small{font-size:15px;font-weight:600;color:var(--m);margin-left:2px;text-transform:lowercase}
.it span{font-size:13px;line-height:1.25;color:var(--muted);overflow-wrap:anywhere}
.qb{margin:0;font-size:14px;color:var(--muted)}
.qb b{color:var(--ink);font-weight:600}
ol.steps{margin:0;padding:0;list-style:none;display:grid;gap:7px;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:24px 1fr;gap:10px;font-size:15px;align-items:start}
ol.steps li::before{content:counter(s);font:700 13px/24px var(--f-display);text-align:center;width:24px;height:24px;border-radius:50%;background:var(--s3);color:var(--ink)}
.note{font-size:14px;color:var(--ink);background:var(--lime-soft);border-radius:10px;padding:8px 11px;margin:0}
.note::before{content:"⏱ ";}
details{margin-top:auto}
summary{cursor:pointer;font:700 14px var(--f-body);color:var(--ink);list-style:none;display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--s2);border-radius:10px;padding:10px 12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:700 20px/1 var(--f-display);color:var(--m)}
details[open] summary::after{content:"–"}
.alts{display:grid;gap:8px;margin-top:8px}
.alt{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.alt b{font:700 18px var(--f-display);text-transform:uppercase;display:block;letter-spacing:.01em}
.alt .ai{font-size:14px;color:var(--m);display:block;margin:2px 0 3px;font-weight:600}
.alt p{margin:0;font-size:14px;color:var(--muted)}
.meal.free{border:1px dashed var(--s3);background:transparent;justify-content:center}
.meal.free p{margin:0;color:var(--muted)}

/* ---- settimana ---- */
h2.sec{font:800 clamp(36px,8vw,52px)/.95 var(--f-display);text-transform:uppercase;margin:0 0 8px}
p.lead{color:var(--muted);margin:0 0 18px;max-width:65ch}
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.wday{background:var(--s1);border-radius:16px;padding:14px;display:grid;gap:10px;min-width:0;border:1px solid transparent}
.wday.istoday{border-color:var(--s3)}
.wtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wtop .daylink{font:800 24px/1 var(--f-display);text-transform:uppercase;color:var(--ink);background:none;border:0;padding:0;cursor:pointer;display:flex;align-items:center;gap:8px}
.wtop .daylink:hover{color:var(--lime)}
.wtop .oggi{font:700 11px var(--f-body);letter-spacing:.12em;color:var(--bg);background:var(--ink);padding:2px 6px;border-radius:4px}
.wmeals{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.wmeals li{display:grid;grid-template-columns:8px 1fr;gap:10px;align-items:baseline}
.wmeals li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--m);transform:translateY(-1px)}
.wmeals .k{display:block;font:700 10.5px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--m)}
.wmeals .n{font-size:15px;font-weight:500}

.switch{display:inline-flex;align-items:center;gap:9px;font:700 14px var(--f-body);color:var(--ink);background:var(--s2);border:0;border-radius:999px;padding:5px 13px 5px 5px;cursor:pointer}
.switch .knob{width:38px;height:22px;border-radius:999px;background:var(--s3);position:relative;transition:background .15s;flex:none}
.switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.switch[aria-checked="true"]{background:var(--lime-soft);color:var(--lime)}
.switch[aria-checked="true"] .knob{background:var(--lime)}
.switch[aria-checked="true"] .knob::after{transform:translateX(16px);background:var(--lime-ink)}
.switch.sm{padding:4px}
@media (prefers-reduced-motion:reduce){.switch .knob,.switch .knob::after{transition:none}}

.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.panel{background:var(--s1);border-radius:16px;padding:18px;min-width:0}
.panel h3{font:800 22px var(--f-display);text-transform:uppercase;margin:0 0 10px;letter-spacing:.01em}
.panel ul{margin:0;padding-left:1.1em;display:grid;gap:7px;font-size:15px}
.panel ul li::marker{color:var(--lime)}

/* ---- scambi ---- */
.tablebox{overflow-x:auto;background:var(--s1);border-radius:16px}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:520px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:700 12px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:0}
td.q{font:700 17px var(--f-display);color:var(--lime);white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---- progressi ---- */
.pgrid{display:grid;gap:14px;margin-top:16px}
.panel.wide{display:grid;gap:12px}
.phead{display:grid;gap:8px;max-width:65ch}
.phead p{margin:0;color:var(--muted)}
.bar{height:8px;border-radius:999px;background:var(--s2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lime);border-radius:999px}
.hint{margin:0;color:var(--muted);font-size:14px;max-width:65ch}
.wform{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.wform label,.dnote{display:grid;gap:5px;font:700 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wform input,.dnote textarea,.altfree,.sumtxt{font:16px var(--f-body);color:var(--ink);background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;box-sizing:border-box;text-transform:none;letter-spacing:0}
.wform input[type=number]{width:8em;font:700 20px var(--f-display)}
.btn{font:700 15px var(--f-body);border:0;background:var(--s2);color:var(--ink);border-radius:10px;padding:10px 16px;cursor:pointer}
.btn:hover{background:var(--s3)}
.btn.primary{background:var(--lime);color:var(--lime-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.35;cursor:default}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.tiles{grid-template-columns:1fr 1fr}.tiles>div:last-child{grid-column:1/-1}}
.tiles>div{background:var(--s2);border-radius:12px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.tiles span{font:700 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tiles b{font:700 30px/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.tiles em{font-style:normal;font-size:13px;color:var(--muted)}
.chartbox{overflow-x:auto}
.chartbox svg{width:100%;min-width:420px;height:auto;display:block}
.chartbox .g{stroke:var(--line);stroke-width:1}
.chartbox .g.v{stroke-dasharray:2 4}
.chartbox .ty,.chartbox .tx{fill:var(--muted);font:600 12px var(--f-body)}
.chartbox .ty{text-anchor:end}
.chartbox .tx{text-anchor:middle}
.chartbox .tx.rev{fill:var(--lime)}
.chartbox .pt{fill:var(--muted);stroke:var(--s1);stroke-width:2}
.chartbox .avg{fill:none;stroke:var(--lime);stroke-width:2;stroke-linejoin:round}
.chartbox .avgdot{fill:var(--lime);stroke:var(--s1);stroke-width:2}
.chartbox .endl{fill:var(--ink);font:700 15px var(--f-display)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:6px}
.legend span{display:flex;align-items:center;gap:6px}
.lg-pt{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.lg-avg{width:16px;height:2px;background:var(--lime)}
.empty-note{background:var(--s2);border-radius:12px;padding:14px;color:var(--muted);font-size:14px}
.wlist summary{font-size:14px}
.linkbtn{border:0;background:none;color:var(--coral);font:700 13px var(--f-body);cursor:pointer;padding:0}
.dnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dnav b{text-align:center;font:800 20px var(--f-display);text-transform:uppercase}
#d-train{justify-self:start}
.dmeals{display:grid;gap:8px}
.dmeal{background:var(--s2);border-radius:12px;padding:11px 12px;display:grid;gap:9px;min-width:0;border-left:0}
.dm-top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.dm-t{font:700 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--m)}
.dm-n{font:700 17px var(--f-display);text-transform:uppercase}
.segs{display:flex;flex-wrap:wrap;gap:6px}
.sg,.chip{font:700 13px var(--f-body);border:1px solid var(--s3);background:transparent;color:var(--ink);border-radius:999px;padding:7px 13px;cursor:pointer}
.sg.piano[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.sg.alt[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--lime-ink)}
.sg.saltato[aria-pressed="true"]{background:var(--coral);border-color:var(--coral);color:var(--lime-ink)}
.altpick{display:flex;flex-wrap:wrap;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}
.altfree{flex:1 1 100%;font-size:15px}
.dnote textarea{width:100%;resize:vertical}
.sumtxt{width:100%;min-height:220px;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace}
.panel .row{display:flex;gap:8px;flex-wrap:wrap}
.ptoast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--lime);color:var(--lime-ink);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
footer{color:var(--dim);font-size:13px;margin-top:36px;max-width:70ch}
@media (prefers-reduced-motion:no-preference){#view.enter section.view{animation:in .22s ease-out}@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
/* ---- tema scuro: stessa identità, superfici verde notte ---- */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111214; --s1:#1c1d20; --s2:#26272b; --s3:#36383d; --line:#2b2c30;
  --ink:#f3f3ef; --muted:#a6a6a1; --dim:#6f6f6a;
  --lime:#f3f3ef; --lime-ink:#111214; --lime-soft:rgba(182,242,58,.14);
  --amber:#f2a516; --coral:#ff6a48;
  --barbg:#1f2023; --sh1:rgba(0,0,0,.25); --sh2:rgba(0,0,0,.4); --shg:rgba(0,0,0,.5);
  --warnbg:rgba(242,165,22,.16); --warnink:#ffd58a;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111214; --s1:#1c1d20; --s2:#26272b; --s3:#36383d; --line:#2b2c30;
  --ink:#f3f3ef; --muted:#a6a6a1; --dim:#6f6f6a;
  --lime:#f3f3ef; --lime-ink:#111214; --lime-soft:rgba(182,242,58,.14);
  --amber:#f2a516; --coral:#ff6a48;
  --barbg:#1f2023; --sh1:rgba(0,0,0,.25); --sh2:rgba(0,0,0,.4); --shg:rgba(0,0,0,.5);
  --warnbg:rgba(242,165,22,.16); --warnink:#ffd58a;
  color-scheme:dark;}

/* ---- app: barra in basso ---- */
body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body.cooking{overflow:hidden}
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(14,17,19,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tb-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
#tabbar button{background:none;border:0;color:var(--dim);display:grid;justify-items:center;gap:3px;padding:9px 2px 10px;cursor:pointer;font:700 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;min-height:58px}
#tabbar svg{width:24px;height:24px}
#tabbar button[aria-current="page"]{color:var(--lime)}
#tabbar button:hover{color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--lime);color:var(--lime-ink);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;z-index:60;max-width:calc(100% - 32px)}

/* ---- pillole dei giorni ---- */
.pills{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;padding-bottom:4px;margin-bottom:14px}
.pills::-webkit-scrollbar{display:none}
.pills button{min-width:0;font:700 15px var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--s1);border:0;border-radius:10px;
  padding:9px 2px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;position:relative}
.pills button.today::after{content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ink)}
.pills button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.pills button[aria-selected="true"].today::after{background:var(--bg)}
.dot.ink{background:var(--on)}

/* ---- oggi: avanzamento, pesata veloce, segna ---- */
.dayprog{display:grid;gap:6px;margin:-2px 0 14px}
.dayprog span{font-size:14px;color:var(--muted)}
.dayprog b{color:var(--ink);font-size:18px}
.quickw{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--lime-soft);border-radius:14px;padding:12px;margin-bottom:14px}
.quickw>div{display:grid;flex:1 1 160px}
.quickw .k{font:800 18px var(--f-display);text-transform:uppercase;color:var(--lime)}
.quickw input{width:6.5em;font:700 22px var(--f-display);color:var(--ink);background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.strip a.is-done{opacity:.55}
.meal.logged{background:linear-gradient(var(--s1),var(--s1)) padding-box}
.st{font:700 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px}
.st.ok{background:var(--lime);color:var(--lime-ink)}
.st.alt{background:var(--amber);color:var(--lime-ink)}
.logrow{display:flex;flex-wrap:wrap;gap:6px}
.lg{flex:1 1 auto;font:700 14px var(--f-body);border:1px solid var(--s3);background:transparent;color:var(--ink);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:44px}
.lg:hover{background:var(--s2)}
.lg.cookb{background:var(--s2);border-color:var(--s2)}
.lg.done[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.lg.swap[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--lime-ink)}

/* ---- modalità cucina ---- */
.cook{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ck-in{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px}
.ck-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cook h3{font:800 clamp(30px,8vw,44px)/1 var(--f-display);text-transform:uppercase;margin:0}
.ck-dots{display:flex;gap:5px}
.ck-dots i{flex:1;height:5px;border-radius:999px;background:var(--s3)}
.ck-dots i.on{background:var(--m)}
.ck-body{flex:1;display:flex;flex-direction:column;gap:14px;justify-content:center;padding-block:10px}
.ck-k{font:700 13px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--m);margin:0}
.ck-step{font:600 clamp(24px,6.4vw,34px)/1.3 var(--f-body);margin:0;text-wrap:pretty}
.tiles-i.big .it b{font-size:34px}
.tiles-i.big .it span{font-size:15px}
.ck-timer{display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:var(--s1);border-radius:16px;padding:14px 16px}
.ck-timer .num{font:800 54px/1 var(--f-display);font-variant-numeric:tabular-nums;flex:1}
.ck-timer.ring .num{color:var(--lime)}
.ck-nav{display:grid;grid-template-columns:1fr 2fr;gap:8px;position:sticky;bottom:0;background:var(--bg);padding-top:8px}
.ck-nav .btn{min-height:56px;font-size:17px}

/* ---- cerca ---- */
.sform{display:flex;gap:8px;margin-bottom:10px}
.sform input{flex:1;min-width:0;font:17px var(--f-body);color:var(--ink);background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.chips .hint{margin-right:2px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sresults{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:10px}
.sres{background:var(--s1);border-radius:16px;padding:14px;display:grid;gap:8px;align-content:start;min-width:0}
.sres h3{font:800 24px/1.05 var(--f-display);text-transform:uppercase;margin:0}
.sres p{margin:0;font-size:14px}
.sres .have{color:var(--muted)} .sres .have b{color:var(--lime);font-weight:700}
.sres .need{color:var(--muted)} .sres .need.ok{color:var(--lime)}
.sdays{display:flex;flex-wrap:wrap;gap:6px}
details.swaps{margin-top:22px}
details.swaps .tablebox{margin-top:8px}

/* ---- spesa ---- */
.seg.two{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--s1);border-radius:12px;padding:4px;margin-bottom:12px}
.seg.two button{border:0;background:transparent;color:var(--muted);border-radius:9px;padding:11px 8px;font:700 15px var(--f-body);cursor:pointer}
.seg.two button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
#ssw{margin-bottom:12px}
.sstat{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--muted);margin-bottom:6px}
.sstat b{color:var(--ink);font-size:18px}
.slist{margin-top:6px}
section.cat{margin-top:16px}
.cat h4{font:700 12px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between}
ul.items{list-style:none;margin:0;padding:0;background:var(--s1);border-radius:14px;overflow:hidden}
li.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:54px}
li.item:first-child{border-top:0}
.txt{flex:1;min-width:0}
.name{font-weight:600;overflow-wrap:anywhere}
.qty{font:700 15px var(--f-display);color:var(--lime);letter-spacing:.02em}
.qty .qmeal{font:500 13px var(--f-body);color:var(--muted);letter-spacing:0}
li.have .name,li.have .qty{color:var(--dim)}

li.taken .qty{color:var(--dim)}
li.tap{cursor:pointer}
.pill{border:0;border-radius:999px;padding:8px 12px;font:700 13px var(--f-body);white-space:nowrap;cursor:pointer}
.pill.buy{background:var(--amber);color:var(--lime-ink)}
.pill.ok{background:var(--s2);color:var(--muted)}
.icon{border:0;background:transparent;color:var(--muted);padding:6px;border-radius:8px;font-size:18px;line-height:1;cursor:pointer}
.check{width:30px;height:30px;border-radius:9px;border:2px solid var(--s3);display:grid;place-items:center;flex:none}
.check svg{width:18px;height:18px;opacity:0}
.check path{stroke:var(--lime-ink)}
li.taken .check{background:var(--lime);border-color:var(--lime)}
li.taken .check svg{opacity:1}
form.sedit{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:8px;flex:1;min-width:0}
form.sedit input,form.sedit select{font:16px var(--f-body);color:var(--ink);background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0;width:100%;box-sizing:border-box}
form.sedit .row,form.sedit select{grid-column:1/-1}
.btn.danger{color:var(--coral)}
.sactions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.sactions .btn{flex:1 1 auto;min-height:48px}
.sactions + .panel{margin-top:12px;display:grid;gap:10px}

/* ---- animazioni ---- */
.slider{position:relative;isolation:isolate}
.slider > .ind{position:absolute;left:0;top:0;z-index:-1;border-radius:10px;pointer-events:none;
  transition:transform .42s cubic-bezier(.34,1.32,.52,1),width .42s cubic-bezier(.34,1.32,.52,1),height .3s ease,opacity .2s}
.slider > button{background:transparent !important;position:relative;transition:color .25s}
.pills > .ind{background:var(--ink)}
.seg.two > .ind{background:var(--ink);border-radius:9px}
.seg.two{position:relative}
#tabbar .tb-in > .ind{background:var(--lime);border-radius:16px}
#tabbar button[aria-current="page"]{color:var(--lime-ink)}
#tabbar button[aria-current="page"] svg{transform:translateY(-1px) scale(1.06)}
#tabbar svg{transition:transform .3s cubic-bezier(.34,1.32,.52,1)}
#tabbar button{border-radius:16px}
.bar i{transition:width .5s cubic-bezier(.22,1,.36,1)}
.switch.noanim .knob,.switch.noanim .knob::after{transition:none !important}
.switch .knob::after{transition:transform .28s cubic-bezier(.34,1.4,.52,1),background .2s}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.12)}70%{transform:scale(.97)}100%{transform:scale(1)}}
.pop{animation:pop .42s cubic-bezier(.34,1.32,.52,1)}
.lg,.chip,.pill,.btn,.sg{transition:background-color .2s,border-color .2s,color .2s,transform .12s}
.lg:active,.chip:active,.pill:active,.btn:active,.sg:active,#tabbar button:active{transform:scale(.96)}
.check{transition:background-color .2s,border-color .2s}
.check svg{transition:opacity .15s}
li.taken .check path{stroke-dasharray:24;stroke-dashoffset:0;animation:tick .32s ease-out}
@keyframes tick{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
li.item{transition:opacity .25s}
.ck-body.fwd{animation:stepIn .32s cubic-bezier(.22,1,.36,1)}
.ck-body.back{animation:stepBack .32s cubic-bezier(.22,1,.36,1)}
@keyframes stepIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes stepBack{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.cook:not([hidden]){animation:cookIn .3s cubic-bezier(.22,1,.36,1)}
@keyframes cookIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.ck-dots i{transition:background-color .3s}
.ck-timer.ring .num{animation:ring 1s ease-in-out infinite}
@keyframes ring{50%{opacity:.35}}
#view.enter .meals > .meal,#view.enter .sresults > .sres,#view.enter .week > .wday{animation:rise .4s cubic-bezier(.22,1,.36,1) both}
#view.enter .meals > .meal:nth-child(2),#view.enter .sresults > .sres:nth-child(2),#view.enter .week > .wday:nth-child(2){animation-delay:.04s}
#view.enter .meals > .meal:nth-child(3),#view.enter .sresults > .sres:nth-child(3),#view.enter .week > .wday:nth-child(3){animation-delay:.08s}
#view.enter .meals > .meal:nth-child(4),#view.enter .sresults > .sres:nth-child(4),#view.enter .week > .wday:nth-child(4){animation-delay:.12s}
@keyframes rise{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .slider > .ind,.bar i,.switch .knob,.switch .knob::after,#tabbar svg{transition:none !important}
  .pop,.ck-body.fwd,.ck-body.back,.cook:not([hidden]),.meals > .meal,.sresults > .sres,.week > .wday,li.taken .check path,.ck-timer.ring .num,section.view{animation:none !important}
}

h1,.hero h2,h2.sec,.meal h3,.strip .n,.wtop .daylink,.alt b,.panel h3,.sres h3,.cook h3,.dnav b,.dm-n,.quickw .k,.it b,.tiles b,.ck-timer .num,.qty,td.q,.mtime,.pills button,.kcal b{text-transform:none;letter-spacing:-.015em}

/* ======== identità «Mazzo di card» ======== */
body{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.m-colazione{--m:var(--sand)} .m-pranzo{--m:var(--cyan)} .m-spuntino,.m-pre{--m:var(--acc)} .m-cena{--m:var(--pink)}
h1,.hero h2,h2.sec,.meal h3,.strip .n,.wtop .daylink,.panel h3,.sres h3,.cook h3,.dnav b,.dm-n,.it b,.tiles b,.ck-timer .num,.cv-res b{font-family:var(--f-display);font-weight:800;letter-spacing:-.045em}
header.top{align-items:center}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:40px;height:40px;flex:none;border-radius:11px}

/* mazzo dei pasti */

let wakeLock = null, timer = null;
function cookMeal(){ const d=DAYS.find(x=>x.k===dayK); return mealsOf(d).find(m=>mkey(m)===cook.k); }
function stepMinutes(s){ const m = /(\d+)(?:\s*[–-]\s*(\d+))?\s*minut/i.exec(s); return m ? +(m[2]||m[1]) : 0; }
function renderCook(){
  const box = document.getElementById("cook");
  if(!cook){ box.hidden = true; box.innerHTML=""; document.body.classList.remove("cooking"); return; }
  const m = cookMeal(), steps = m.st||[], n = steps.length + 1, i = cook.i;
  let body;
  if(i===0) body = `<p class="ck-k">Prepara</p><div class="tiles-i big">${m.ing.map(tileHTML).filter(Boolean).join("")}</div>
     ${m.ing.filter(x=>!tileHTML(x)).length?`<p class="qb"><b>Anche:</b> ${esc(m.ing.filter(x=>!tileHTML(x)).map(([,x])=>x).join(", "))}</p>`:""}`;
  else {
    const s = steps[i-1], mins = stepMinutes(s);
    const tm = timer && timer.i===i ? timer : null;
    const left = tm ? Math.max(0, Math.round((tm.end-Date.now())/1000)) : mins*60;
    body = `<p class="ck-k">Passaggio ${i} di ${steps.length}</p><p class="ck-step">${esc(s)}</p>
      ${mins?`<div class="ck-timer ${tm&&left===0?"ring":""}"><span class="num" id="ck-left">${pad(Math.floor(left/60))}:${pad(left%60)}</span>
        ${tm?`<button class="btn" data-ck="stop">Ferma</button>`:`<button class="btn primary" data-ck="timer" data-min="${mins}">Avvia timer ${mins} min</button>`}</div>`:""}`;
  }
  const last = i===n-1, isToday = dayK===TODAY_K && db;
  box.className = `cook m-${mkey(m)}`;
  box.innerHTML = `<div class="ck-in">
    <div class="ck-top"><span class="mtag">${mlabel(m)}</span><button class="btn" data-ck="close" aria-label="Chiudi modalità cucina">✕ Chiudi</button></div>
    <h3>${esc(m.n)}</h3>
    <div class="ck-dots">${Array.from({length:n},(_,j)=>`<i class="${j<=i?"on":""}"></i>`).join("")}</div>
    <div class="ck-body ${cook.dir||""}" ${cook.dir?"":""}>${body}</div>
    <div class="ck-nav"><button class="btn" data-ck="prev" ${i===0?"disabled":""}>‹ Indietro</button>
      ${last ? (isToday?`<button class="btn primary" data-ck="done">✓ Fatto, segna il pasto</button>`:`<button class="btn primary" data-ck="close">Finito</button>`)
             : `<button class="btn primary" data-ck="next">Avanti ›</button>`}</div></div>`;
  box.hidden = false; document.body.classList.add("cooking"); cook.dir = "";
}
async function openCook(k){
  cook = {k, i:0}; renderCook();
  try{ if("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); }catch(e){ wakeLock=null; }
}
function closeCook(){ cook=null; timer && clearInterval(timer.h); timer=null; try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock=null; renderCook(); }
document.addEventListener("visibilitychange", async ()=>{ if(cook && document.visibilityState==="visible" && "wakeLock" in navigator){ try{ wakeLock = await navigator.wakeLock.request("screen"); }catch(e){} } });
function beep(){
  try{ const A=window.AudioContext||window.webkitAudioContext; const c=new A(); [0,0.35,0.7].forEach(t=>{ const o=c.createOscillator(), g=c.createGain(); o.frequency.value=880; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(0.25,c.currentTime+t); g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+t+0.3); o.start(c.currentTime+t); o.stop(c.currentTime+t+0.3); }); }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([300,150,300]); }catch(e){}
}
function startTimer(min){
  timer && clearInterval(timer.h);
  timer = {i:cook.i, end:Date.now()+min*60000, h:null, rang:false};
  timer.h = setInterval(()=>{
    const left = Math.max(0, Math.round((timer.end-Date.now())/1000));
    const el = document.getElementById("ck-left"); if(el) el.textContent = `${pad(Math.floor(left/60))}:${pad(left%60)}`;
    if(left===0 && !timer.rang){ timer.rang=true; beep(); renderCook(); toast("Tempo scaduto"); }
  }, 500);
  renderCook();
}
document.getElementById("cook").addEventListener("click", async e=>{
  const b = e.target.closest("[data-ck]"); if(!b) return;
  const a = b.dataset.ck, m = cook && cookMeal(), n = m ? (m.st||[]).length+1 : 0;
  if(a==="close") closeCook();
  else if(a==="next"){ cook.i = Math.min(n-1, cook.i+1); cook.dir="fwd"; renderCook(); }
  else if(a==="prev"){ cook.i = Math.max(0, cook.i-1); cook.dir="back"; renderCook(); }
  else if(a==="timer") startTimer(+b.dataset.min);
  else if(a==="stop"){ timer && clearInterval(timer.h); timer=null; renderCook(); }
  else if(a==="done"){ const slot=SLOT[m.t]; closeCook(); await saveDiaryFor(todayISO(), {pasti:{[slot]:{stato:"piano"}}}); toast("Pasto segnato"); }
});

  Object.entries(REST).forEach(([k,r])=>{ if(seen["sp:"+r.n]) return; seen["sp:"+r.n]=1; out.push({kind:"main", n:r.n, t:"Spuntino", mk:"spuntino", days:[k], ings:r.ing.map(([q,x])=>({q,x})), rest:true}); });
  [...Object.values(COL)].forEach(a=>{ if(seen["alt:"+a.n]) return; seen["alt:"+a.n]=1; out.push({kind:"alt", n:a.n, t:"Colazione", mk:"colazione", of:"qualsiasi colazione", days:[], ings:a.i.split(" · ").map(x=>({q:"",x})), p:a.p}); });
  [...Object.values(SPU)].forEach(a=>{ if(seen["alt:"+a.n]) return; seen["alt:"+a.n]=1; out.push({kind:"alt", n:a.n, t:"Spuntino", mk:"spuntino", of:"qualsiasi spuntino", days:[], ings:a.i.split(" · ").map(x=>({q:"",x})), p:a.p}); });
  return out;
}
const INDEX = buildIndex();
function searchResults(){
  if(!searchChips.length) return [];
  const chips = searchChips.map(stem);
  return INDEX.map(r=>{
    const have = [], need = [];
    r.ings.forEach(g=>{
      const txt = norm(g.x);
      const hit = chips.some(c=>txt.split(/[^a-z']+/).some(w=>w.startsWith(c) || stem(w)===c));
      if(hit) have.push(g); else if(!PANTRY.some(p=>txt.includes(p))) need.push(g);
    });
    return {...r, have, need};
  }).filter(r=>r.have.length).sort((a,b)=> b.have.length-a.have.length || a.need.length-b.need.length || (a.kind==="main"?-1:1));
}

function converti(idAlimento, grammi, stato){
  const a = ALIMENTI[idAlimento];
  if(!a || !(grammi > 0) || (stato!=="cotto" && stato!=="crudo")) return null;
  const crudo = stato==="cotto" ? grammi / a.fattore : grammi;
  const cotto = stato==="cotto" ? grammi : grammi * a.fattore;
  return { crudo: Math.round(crudo), cotto: Math.round(cotto), kcal: a.kcalCrudo100 ? Math.round(crudo * a.kcalCrudo100 / 100) : null };
}

function planDoseToday(id){
  const a = ALIMENTI[id]; if(!a.match) return null;
  const d = DAYS.find(x=>x.k===TODAY_K);

    const hit = m.ing.find(([q,x])=>q && a.match.test(x)); if(hit) return {q:hit[0], x:hit[1], pasto:mlabel(m)}; }
  return null;
}

  return Object.keys(g).map(Number).sort((a,b)=>a-b).map(w=>{ const ps=g[w]; return {w, avg:ps.reduce((s,p)=>s+p.kg,0)/ps.length, n:ps.length, mid:ps.reduce((s,p)=>s+diffDays(INIZIO,p.data),0)/ps.length}; });
}
function chartSVG(){
  if(!pesate.length) return `<div class="empty-note">Il grafico compare dopo la prima pesata.</div>`;
  const W=640, H=240, L=46, R=62, T=18, B=34;
  const xs = pesate.map(p=>diffDays(INIZIO,p.data)), x0 = Math.min(0,...xs), x1 = Math.max(revGiorni(),...xs);
  const kgs = pesate.map(p=>p.kg);
  const y0 = Math.floor((Math.min(...kgs)-0.6)*2)/2, y1 = Math.ceil((Math.max(...kgs)+0.6)*2)/2;
  const sx = v => L + (v-x0)/(x1-x0||1)*(W-L-R), sy = v => T + (y1-v)/(y1-y0||1)*(H-T-B);
  const step = (y1-y0) > 4 ? 1 : 0.5;
  let grid = "";
  for(let v=y0; v<=y1+1e-9; v+=step){ const y=sy(v).toFixed(1); grid += `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" class="g"/><text x="${L-8}" y="${y}" class="ty" dy="4">${kgFmt(v)}</text>`; }
  let xt = "";
  for(let v=0; v<=x1; v+=7){ const x=sx(v).toFixed(1); xt += `<line x1="${x}" x2="${x}" y1="${T}" y2="${H-B}" class="g v"/><text x="${x}" y="${H-B+20}" class="tx">${fmt(addDays(INIZIO,v))}</text>`; }
  xt += `<text x="${sx(revGiorni()).toFixed(1)}" y="${T-5}" class="tx rev">revisione</text>`;
  const wk = weekly();
  const line = wk.length>1 ? `<polyline class="avg" points="${wk.map(w=>`${sx(w.mid).toFixed(1)},${sy(w.avg).toFixed(1)}`).join(" ")}"/>` : "";
  const avgDots = wk.map(w=>`<circle class="avgdot" cx="${sx(w.mid).toFixed(1)}" cy="${sy(w.avg).toFixed(1)}" r="5"><title>Media settimana ${w.w+1}: ${kgFmt(w.avg)} kg (${w.n} pesate)</title></circle>`).join("");
  const dots = pesate.map(p=>`<circle class="pt" cx="${sx(diffDays(INIZIO,p.data)).toFixed(1)}" cy="${sy(p.kg).toFixed(1)}" r="4"><title>${fmtLong(p.data)}: ${kgFmt(p.kg)} kg</title></circle>`).join("");
  const last = wk[wk.length-1];
  return `<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Andamento del peso: pesate singole e media settimanale">${grid}${xt}${dots}${line}${avgDots}<text x="${(sx(last.mid)+10).toFixed(1)}" y="${sy(last.avg).toFixed(1)}" dy="5" class="endl">${kgFmt(last.avg)} kg</text></svg>
    <div class="legend"><span><i class="lg-pt"></i>Pesata</span><span><i class="lg-avg"></i>Media della settimana</span></div></div>`;
}

function buildSummary(){
  const t = todayISO(), end = t < REVISIONE ? t : REVISIONE;
  const days = Object.values(diario).filter(d=>d.data>=INIZIO && d.data<=end).sort((a,b)=>a.data<b.data?-1:1);
  let piano=0, alt=0, salt=0; const altCount={};
  days.forEach(d=>Object.values(d.pasti||{}).forEach(v=>{ if(v.stato==="piano") piano++; else if(v.stato==="saltato") salt++; else if(v.stato==="alt"){ alt++; if(v.scelta) altCount[v.scelta]=(altCount[v.scelta]||0)+1; } }));
  const tot = piano+alt+salt, allen = days.filter(d=>d.allenamento).length;
  const wk = weekly().filter(w=>w.w>=0 && w.w<=weekIdx(end)), ps = pesate.filter(p=>p.data>=INIZIO && p.data<=end);
  const L = [`Riepilogo piano alimentare, dal ${fmt(INIZIO)} al ${fmt(end)}`, "", "PESO"];
  if(ps.length){ L.push(`- Prima pesata: ${kgFmt(ps[0].kg)} kg (${fmt(ps[0].data)})`, `- Ultima pesata: ${kgFmt(ps[ps.length-1].kg)} kg (${fmt(ps[ps.length-1].data)})`); wk.forEach(w=>L.push(`- Media settimana ${w.w+1}: ${kgFmt(w.avg)} kg (${w.n} pesate)`)); if(wk.length>=2){ const d=wk[wk.length-1].avg-wk[0].avg; L.push(`- Differenza tra prima e ultima media: ${(d>0?"+":"")+kgFmt(d)} kg`); } }
  else L.push("- Nessuna pesata registrata");
  L.push("", "PASTI");
  if(tot){ L.push(`- Pasti registrati: ${tot} in ${days.length} giorni`, `- Come da piano: ${piano} (${Math.round(piano/tot*100)}%)`, `- Con un'alternativa: ${alt}`, `- Saltati: ${salt}`); const top = Object.entries(altCount).sort((a,b)=>b[1]-a[1]).slice(0,3); if(top.length) L.push(`- Alternative più scelte: ${top.map(([n,c])=>`${n} (${c})`).join(", ")}`); }
  else L.push("- Nessun pasto registrato");
  L.push("", "ALLENAMENTI", `- Allenamenti segnati: ${allen}`);
  const notes = days.filter(d=>d.nota && d.nota.trim()); if(notes.length){ L.push("", "NOTE"); notes.forEach(d=>L.push(`- ${fmt(d.data)}: ${d.nota.trim()}`)); }
  return L.join("\n");
}

/* ---------- animazioni ---------- */
const slidePos = {}, barPos = {}, swPos = {};
let flash = null, lastView = "";
const still = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
function animate(){
  const vk = tab+"|"+dayK+"|"+sScope+"|"+sDay;
  if(vk!==lastView){ lastView=vk; if(!still()){ view.classList.remove("enter"); void view.offsetWidth; view.classList.add("enter"); clearTimeout(animate.t); animate.t=setTimeout(()=>view.classList.remove("enter"),700); } }
  document.querySelectorAll("[data-slide]").forEach(c=>{
    const key = c.dataset.slide, ind = c.querySelector(":scope > .ind");
    const sel = c.querySelector(':scope > [aria-selected="true"], :scope > [aria-pressed="true"], :scope > [aria-current="page"]');
    if(!ind) return;
    if(!sel){ ind.style.opacity = 0; delete slidePos[key]; return; }
    const [iy,ix] = (c.dataset.inset||"0,0").split(",").map(Number);
    const r = {x:sel.offsetLeft+ix, y:sel.offsetTop+iy, w:sel.offsetWidth-2*ix, h:sel.offsetHeight-2*iy};
    const set = o=>{ ind.style.transform=`translate(${o.x}px,${o.y}px)`; ind.style.width=o.w+"px"; ind.style.height=o.h+"px"; };
    const from = slidePos[key];
    ind.style.opacity = 1;
    ind.style.transition = "none"; set(from||r); void ind.offsetWidth; ind.style.transition = ""; set(r);
    slidePos[key] = r;
  });
  document.querySelectorAll("[data-bar] > i").forEach(i=>{
    const key = i.parentElement.dataset.bar, to = i.style.width, from = barPos[key];
    if(from!==undefined && from!==to){ i.style.transition="none"; i.style.width=from; void i.offsetWidth; i.style.transition=""; i.style.width=to; }
    barPos[key] = to;
  });
  document.querySelectorAll('[role="switch"][id]').forEach(sw=>{
    const to = sw.getAttribute("aria-checked"), from = swPos[sw.id];
    if(from!==undefined && from!==to){ sw.classList.add("noanim"); sw.setAttribute("aria-checked",from); void sw.offsetWidth; sw.classList.remove("noanim"); sw.setAttribute("aria-checked",to); }
    swPos[sw.id] = to;
  });
  if(flash){ const el=document.querySelector(flash); if(el && !still()){ el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); } flash=null; }
}
window.addEventListener("resize", ()=>{ for(const k in slidePos) delete slidePos[k]; animate(); });

    if(b=q("[data-take]")){ const i=sAll().find(x=>x.id===b.dataset.take); if(i){ if(!i.taken) flash=`[data-take="${i.id}"] .check`; sWrite(i.id,{taken:!i.taken}); } return; }

    if(q("#sdoreset")){ sPanel=null; const pool = sScope==="week"?weekItems:dayItems.filter(i=>i.giorno===sDay); const todo=pool.filter(i=>i.have||i.taken); todo.forEach(i=>{i.have=false;i.taken=false}); render(); for(const i of todo){ try{ await sColOf(i).doc(i.id).update({have:false,taken:false}); }catch(_){} } toast("Lista azzerata"); return; }

});

async function savePesata(data, kgRaw){
  const kg = parseFloat(String(kgRaw).replace(",", "."));
  if(!data || !(kg>30 && kg<250)){ toast("Controlla data e peso"); return; }
  const doc = {data, kg:Math.round(kg*10)/10};
  pesate = pesate.filter(p=>p.id!==data).concat([{id:data,...doc}]).sort((a,b)=>a.data<b.data?-1:1);
  document.activeElement && document.activeElement.blur(); render();
  try{ await db.collection("pesate").doc(data).set(doc); toast("Pesata salvata"); }
  catch(err){ toast("Non salvata, riprova"); }
}

    return;
  }
  if(f.id==="wform") return savePesata(document.getElementById("w-date").value, document.getElementById("w-kg").value);
  if(f.id==="qwform") return savePesata(todayISO(), document.getElementById("qw-kg").value);
  if(f.id==="saddf"){
    const name=document.getElementById("n-name").value.trim(); if(!name) return;
    const data={name, qty:document.getElementById("n-qty").value.trim(), cat:document.getElementById("n-cat").value, have:false, taken:false, order:900};
    if(sScope==="day") Object.assign(data,{giorno:sDay, quando:"sempre", pasto:""});
    document.getElementById("n-name").value=""; document.getElementById("n-qty").value="";
    try{ await db.collection(sScope==="week"?"spesa":"spesa_giorni").add(data); toast("Aggiunto"); }catch(_){ toast("Non aggiunto, riprova"); }
    return;
  }
  if(f.classList.contains("sedit") && f.dataset.id){ const id=f.dataset.id; const patch={name:document.getElementById("e-name").value.trim()||"Senza nome", qty:document.getElementById("e-qty").value.trim()}; sEditing=null; await sWrite(id,patch); }
});
document.addEventListener("change", e=>{
  if(!db) return;
  const af = e.target.closest("[data-altfree]");
  if(af){ const v=af.value.trim(); if(v) saveDiaryFor(tab==="oggi"?todayISO():diaryDate, {pasti:{[af.dataset.altfree]:{stato:"alt", scelta:v}}}); }
  if(e.target.id==="d-note"){ const cur=(diario[diaryDate]||{}).nota||""; if(e.target.value!==cur) saveDiary({nota:e.target.value}); }
});


/* ---------- copia di sicurezza (solo app installata) ---------- */
function backupHTML(){
  if(!window.RicettarioStore) return "";
  return `<div class="panel wide"><h3>Copia di sicurezza</h3>
    <p class="hint">I dati stanno solo su questo telefono. Salva una copia ogni tanto: se cambi telefono o cancelli i dati del browser, la ricarichi da qui.</p>
    <div class="row"><button class="btn primary" id="bk-save">Salva una copia</button><label class="btn" for="bk-file">Carica una copia</label>
    <input type="file" id="bk-file" accept="application/json,.json" hidden></div></div>`;
}
document.addEventListener("click", async e=>{
  if(!e.target.closest("#bk-save")) return;
  const txt = window.RicettarioStore.exportJSON(), name = `ricettario-copia-${todayISO()}.json`;
  const file = new File([txt], name, {type:"application/json"});
  try{ if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); return; } }catch(err){ if(err && err.name==="AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast("Copia salvata");
});
document.addEventListener("change", async e=>{
  if(e.target.id!=="bk-file" || !e.target.files[0]) return;
  try{ window.RicettarioStore.importJSON(await e.target.files[0].text()); toast("Copia caricata"); }
  catch(err){ toast(err.message || "File non valido"); }
  e.target.value = "";
});

/* ---------- avvio ---------- */
const h = location.hash.slice(1);
if(TABS.some(([k])=>k===h)) tab = h;
else if(DAYS.some(d=>d.k===h)){ tab="oggi"; dayK=h; }
render();
(async ()=>{
  await Promise.resolve();
  try{ db = window.claude ? await window.claude.use("db") : null; }catch(_){ db = null; }
  dbState = db ? "ready" : "off";
  if(!db){ render(); return; }
  const lost = ()=>toast("Connessione persa: ricarica la pagina");
  db.doc("impostazioni/piano").onSnapshot(s=>{ if(s.exists){ const d=s.data(); if(d.inizio) INIZIO=d.inizio; if(d.revisione) REVISIONE=d.revisione; } liveRender(); }, lost);
  db.doc("impostazioni/allenamento").onSnapshot(s=>{ if(s.exists){ const d=s.data(); TRAIN = new Set(WD.filter(k=>d[k])); } liveRender(); }, lost);
  db.collection("pesate").onSnapshot(s=>{ pesate = s.docs.map(d=>({id:d.id,...d.data()})).filter(p=>typeof p.kg==="number").sort((a,b)=>a.data<b.data?-1:1); liveRender(); }, lost);
  db.collection("diario").onSnapshot(s=>{ const o={}; s.docs.forEach(d=>o[d.id]={...d.data()}); diario=o; liveRender(); }, lost);
  db.collection("spesa").onSnapshot(s=>{ weekItems = s.docs.map(d=>({id:d.id,_col:"spesa",...d.data()})); liveRender(); }, lost);
  db.collection("spesa_giorni").onSnapshot(s=>{ dayItems = s.docs.map(d=>({id:d.id,_col:"spesa_giorni",...d.data()})); liveRender(); }, lost);
  render();
})();

</script>
